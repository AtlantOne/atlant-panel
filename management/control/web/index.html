<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Atlant Control</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./panel-shell.css?v=20261101">
  <script src="./theme.js"></script>
  <script src="./forms.js" defer></script>
  <script src="./qrcode.js" defer></script>
  <script src="./share.js" defer></script>
  <script src="./app.js" defer></script>
  <script src="./drawer.js" defer></script>
</head>
<body>
  <header class="topbar"><button id="open-navigation" class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="panel-sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><a href="./" class="brand"><span class="brand-mark">A</span>Atlant<span>Control</span></a></header>
  <div hidden><select id="theme" aria-label="Theme"><option value="dark" data-i18n="theme_dark">Dark</option><option value="light" data-i18n="theme_light">Light</option></select><select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="zh">简体中文</option></select></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <section id="login">
    <div class="login-emblem">A</div><p class="eyebrow">ATLANT CONTROL</p>
    <h1 data-i18n="login_greeting">Welcome back</h1><p data-i18n="login_description">Secure management for your Atlant network</p>
    <form id="login-form" method="post" autocomplete="on">
      <label><span data-i18n="username">Login</span><input type="text" id="username" name="username" required maxlength="64" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label><span data-i18n="password">Password</span><input type="password" id="password" name="password" required maxlength="256" autocomplete="current-password"></label>
      <label class="check show-password"><input type="checkbox" id="show-password"><span data-i18n="show_password">Show password</span></label>
      <button type="submit" class="primary" data-i18n="login">Sign in</button>
    </form><p class="login-footnote">REALITY · QUIC · TCP · XHTTP</p>
  </section>
  <div id="workspace" hidden><aside class="sidebar" id="panel-sidebar"><button id="close-navigation" class="menu-toggle" type="button" aria-label="Close navigation">✕</button><div class="workspace-brand"><span class="workspace-symbol">A</span><div>Atlant<span>CONTROL CENTER</span></div></div><div class="sidebar-label" data-i18n="control_plane">CONTROL PLANE</div><nav id="navigation" aria-label="Navigation"></nav><div class="sidebar-footer"><button id="logout" class="danger" hidden></button><a href="./license" target="_blank" rel="noopener">GPLv3 ↗</a></div></aside><main id="content"></main></div>
  <button id="navigation-backdrop" type="button" aria-label="Close navigation" hidden></button>
  <dialog id="confirmation"><h2 data-i18n="confirm_write">Confirm this change</h2><p id="operation-label"></p><div class="actions"><button id="cancel-confirmation" data-i18n="cancel">Cancel</button><button id="commit" data-i18n="confirm_write">Confirm this change</button></div></dialog>
  <dialog id="result"><h2 id="result-title"></h2><pre id="result-body"></pre><button id="close-result" data-i18n="cancel">Close</button></dialog>
  <dialog id="editor"><h2 id="editor-title"></h2><div id="editor-body"></div><footer class="editor-footer"><button id="close-editor" data-i18n="cancel">Close</button><button id="save-editor" class="primary" hidden data-i18n="save">Save</button></footer></dialog>
</body>
</html>
